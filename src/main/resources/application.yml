server:
  port: 8080

spring:
  application:
    name: smartstock-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartstock}
    username: ${DB_USERNAME:smartstock}
    password: ${DB_PASSWORD:smartstock}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Ho_Chi_Minh

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-must-be-at-least-32-bytes-long}
    expiration-ms: 3600000 # 60 phút

llm:
  provider: ${LLM_PROVIDER:mock}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-3-5-sonnet-latest